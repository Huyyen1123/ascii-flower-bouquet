<title>ASCII Flower Bouquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* One terminal window, centred on pure black: the bouquet is the whole page. */
  :root {
    --bg: #000000;          /* same black the renderer paints behind every cell */
    --panel: #0c0c0e;
    --line: #26262c;
    --fg: #e6e6ea;
    --muted: #8d8d98;
    --accent: #ff5fa8;      /* the ribbon pink */
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .term {
    width: min(100%, 880px);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
  .bar .name { flex: 1; text-align: center; letter-spacing: 0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas { display: block; width: 100%; height: auto; }
  .controls {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    font: 600 13px var(--mono);
    color: var(--bg);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btns { display: flex; gap: 8px; }
  button.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  code { color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
  #status { min-height: 1em; }
  button:disabled { opacity: 0.4; cursor: default; }
  .player {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .songname { color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.02em; }
  .songmsg a { color: var(--accent); }
  /* SoundCloud's compact (20 px) player, inverted so it sits dark on black. */
  .sc {
    flex-basis: 100%;
    width: 100%;
    height: 20px;
    border: 0;
    border-radius: 4px;
    filter: invert(1) hue-rotate(180deg);
    opacity: 0.85;
  }
  [hidden] { display: none !important; }
  .songmsg { flex-basis: 100%; color: var(--muted); }
  .gate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.6);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .gate button { font-size: 16px; padding: 12px 22px; }
</style>

<div class="term">
  <div class="bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="name">python3 main.py — 150×78</span>
    <span style="width:42px"></span>
  </div>
  <canvas id="screen" width="880" height="920" aria-label="A rotating bouquet of flowers drawn in coloured ASCII characters"></canvas>
</div>
<div class="controls">
  <span class="btns"><button id="toggle" type="button">Pause</button>
  <button id="replay" type="button" class="ghost">Replay bloom</button></span>
  <span id="status"></span>
</div>
<div class="player" aria-label="Music">
  <span class="songname">Ribs — Lorde</span>
  <button id="songplay" type="button" aria-pressed="false">Play our song ♡</button>
  <span class="songmsg" id="songmsg" role="status" hidden></span>
  <iframe id="sc" class="sc" title="Ribs by Lorde on SoundCloud" allow="autoplay; encrypted-media"
          src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A500269605&amp;color=%23ff5fa8&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false&amp;show_artwork=false&amp;visual=false"></iframe>
</div>
<script src="https://w.soundcloud.com/player/api.js"></script>
<div class="gate" id="gate">
  <button id="open" type="button">Open your flowers</button>
</div>

<script>
const META = __META__;
const BLOB = "__BLOB__";

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('toggle');
const status = document.getElementById('status');
const { w: W, h: H, n: N, period: PERIOD, chars: CHARS, palette } = META;
const COLORS = [null, ...palette];
const BG = '#000000';
const replay = document.getElementById('replay');
// The first NI frames are the bloom (played once, INTRO seconds long); the
// N frames after them loop forever.
const INTRO = META.intro, NI = META.ni;
let frames = null, playing = false, frameIdx = -1, t0 = performance.now(), offset = 0;
function indexAt(elapsed) {
  elapsed = Math.max(0, elapsed);     // a frame stamped just before a tap
  if (elapsed < INTRO) return Math.min(NI - 1, Math.floor(elapsed / INTRO * NI));
  return NI + Math.floor(((elapsed - INTRO) % PERIOD) / PERIOD * N) % N;
}
let cw = 0, chh = 0, fs = 0;

function layout() {
  const cssW = canvas.parentElement.clientWidth;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = cssW / W;                 // a cell is half as wide as it is tall
  chh = cw * 2.05;
  fs = cw / 0.6;
  canvas.style.height = (chh * H) + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(chh * H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `700 ${fs}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
}

function draw(i) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cw * W, chh * H);
  if (!frames) return;
  const base = i * W * H;
  let last = -1;
  for (let y = 0; y < H; y++) {
    const cy = (y + 0.5) * chh;
    for (let x = 0; x < W; x++) {
      const v = frames[base + y * W + x];
      if (!v) continue;
      const c = v >> 4;
      if (c !== last) { ctx.fillStyle = COLORS[c]; last = c; }
      ctx.fillText(CHARS[v & 15], (x + 0.5) * cw, cy);
    }
  }
}

function tick(now) {
  if (playing) {
    const i = indexAt((now - t0) / 1000 + offset);
    if (i !== frameIdx) { frameIdx = i; draw(i); }
  }
  requestAnimationFrame(tick);
}

async function decode() {
  const bin = Uint8Array.from(atob(BLOB), ch => ch.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint16Array(buf);
}

btn.addEventListener('click', () => {
  if (playing) { offset = (performance.now() - t0) / 1000 + offset; playing = false; btn.textContent = 'Play'; }
  else { t0 = performance.now(); playing = true; btn.textContent = 'Pause'; }
});
replay.addEventListener('click', () => {
  t0 = performance.now(); offset = 0; frameIdx = -1;
  playing = true; btn.textContent = 'Pause';
});
window.addEventListener('resize', () => { layout(); if (frameIdx >= 0) draw(frameIdx); });

// ---- Music: "Ribs" by Lorde, streamed by SoundCloud's embedded player -------
// Nothing is downloaded or rehosted: the page drives SoundCloud's own player
// through its Widget API. Phones only allow sound after a tap, so music
// starts from "Open your flowers" or "Play our song"; if the browser still
// blocks it, the visitor gets SoundCloud's own play button and a link.
const TRACK_PAGE = 'https://soundcloud.com/user-881998659/ribs-lorde-audiotrimmercom';
const songBtn = document.getElementById('songplay');
const songMsg = document.getElementById('songmsg');
const scFrame = document.getElementById('sc');
const gate = document.getElementById('gate');
const openBtn = document.getElementById('open');
let widget = null, scReady = false, scPlaying = false, wantPlay = false, startTimer = 0;

function tellUser(text, withLink) {
  songMsg.replaceChildren(document.createTextNode(text));
  if (withLink) {
    const a = document.createElement('a');
    a.href = TRACK_PAGE; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Listen on SoundCloud';
    songMsg.append(' ', a);
  }
  songMsg.hidden = false;
}
function setPlaying(on) {
  scPlaying = on;
  songBtn.textContent = on ? 'Pause our song' : 'Play our song ♡';
  songBtn.setAttribute('aria-pressed', String(on));
  document.body.dataset.music = on ? 'playing' : (scReady ? 'ready' : 'loading');
}
function playSong() {
  wantPlay = true;
  if (!scReady) return;                     // starts as soon as the player is ready
  widget.play();
  clearTimeout(startTimer);
  startTimer = setTimeout(() => {
    if (!scPlaying) tellUser('Your browser held the music back. Tap ▶ in the SoundCloud player above, or', true);
  }, 3000);
}
function initSoundCloud() {
  if (!window.SC || !SC.Widget) {
    tellUser("The SoundCloud player couldn't load.", true);
    document.body.dataset.music = 'unavailable';
    return;
  }
  widget = SC.Widget(scFrame);
  const E = SC.Widget.Events;
  widget.bind(E.READY, () => {
    scReady = true;
    setPlaying(false);
    if (wantPlay) playSong();
  });
  widget.bind(E.PLAY, () => { clearTimeout(startTimer); songMsg.hidden = true; setPlaying(true); });
  widget.bind(E.PAUSE, () => setPlaying(false));
  widget.bind(E.FINISH, () => { widget.seekTo(0); widget.play(); });   // keep it going
  widget.bind(E.ERROR, () => tellUser("SoundCloud couldn't play the song here.", true));
  setTimeout(() => {
    if (!scReady) {
      tellUser("The SoundCloud player didn't load.", true);
      document.body.dataset.music = 'unavailable';
    }
  }, 12000);
}
songBtn.addEventListener('click', () => {
  if (scPlaying) { wantPlay = false; widget.pause(); } else playSong();
});
document.body.dataset.music = 'loading';
initSoundCloud();

// "Open your flowers": starts the bloom from the bud and the song together.
openBtn.addEventListener('click', () => {
  gate.hidden = true;
  t0 = performance.now(); offset = 0; frameIdx = -1;
  playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  btn.textContent = playing ? 'Pause' : 'Play';
  if (!playing) draw(0);
  playSong();
});

(async () => {
  layout(); draw(0);
  try { await document.fonts.load(`700 16px "JetBrains Mono"`); } catch (e) {}
  try {
    frames = await decode();
  } catch (e) {
    status.textContent = 'This browser could not unpack the animation. Try a current Chrome, Safari or Firefox.';
    return;
  }
  layout(); draw(0);
  openBtn.focus();
  requestAnimationFrame(tick);
})();
</script>
