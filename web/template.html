<title>ASCII Flower Bouquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* One terminal window, centred on pure black: the bouquet is the whole page. */
  :root {
    --bg: #000000;          /* same black the renderer paints behind every cell */
    --panel: #0c0c0e;
    --line: #26262c;
    --fg: #e6e6ea;
    --muted: #8d8d98;
    --accent: #ff5fa8;      /* the ribbon pink */
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .term {
    width: min(100%, 880px);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
  .bar .name { flex: 1; text-align: center; letter-spacing: 0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas { display: block; width: 100%; height: auto; }
  .controls {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    font: 600 13px var(--mono);
    color: var(--bg);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btns { display: flex; gap: 8px; }
  button.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  code { color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
  #status { min-height: 1em; }
  button:disabled { opacity: 0.4; cursor: default; }
  .player {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .songname { flex-basis: 100%; color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time { font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: center; }
  #seek { flex: 1 1 160px; min-width: 0; accent-color: var(--accent); cursor: pointer; }
  #seek:disabled { cursor: default; }
  [hidden] { display: none !important; }
  .songmsg { flex-basis: 100%; color: var(--accent); }
  .gate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.6);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .gate button { font-size: 16px; padding: 12px 22px; }
</style>

<div class="term">
  <div class="bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="name">python3 main.py — 150×78</span>
    <span style="width:42px"></span>
  </div>
  <canvas id="screen" width="880" height="920" aria-label="A rotating bouquet of flowers drawn in coloured ASCII characters"></canvas>
</div>
<div class="controls">
  <span class="btns"><button id="toggle" type="button">Pause</button>
  <button id="replay" type="button" class="ghost">Replay bloom</button></span>
  <span id="status"></span>
</div>
<div class="player" aria-label="Music">
  <span class="songname" id="songname">__SONG_TITLE__</span>
  <span class="songmsg" id="songmsg" role="status" hidden></span>
  <button id="songplay" type="button">Play song</button>
  <span class="time" id="cur">0:00</span>
  <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Song position">
  <span class="time" id="dur">--:--</span>
</div>
<audio id="audio" preload="metadata" loop playsinline src="audio/song.mp3"></audio>
<div class="gate" id="gate">
  <button id="open" type="button">Open your flowers</button>
</div>

<script>
const META = __META__;
const BLOB = "__BLOB__";

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('toggle');
const status = document.getElementById('status');
const { w: W, h: H, n: N, period: PERIOD, chars: CHARS, palette } = META;
const COLORS = [null, ...palette];
const BG = '#000000';
const replay = document.getElementById('replay');
// The first NI frames are the bloom (played once, INTRO seconds long); the
// N frames after them loop forever.
const INTRO = META.intro, NI = META.ni;
let frames = null, playing = false, frameIdx = -1, t0 = performance.now(), offset = 0;
function indexAt(elapsed) {
  elapsed = Math.max(0, elapsed);     // a frame stamped just before a tap
  if (elapsed < INTRO) return Math.min(NI - 1, Math.floor(elapsed / INTRO * NI));
  return NI + Math.floor(((elapsed - INTRO) % PERIOD) / PERIOD * N) % N;
}
let cw = 0, chh = 0, fs = 0;

function layout() {
  const cssW = canvas.parentElement.clientWidth;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = cssW / W;                 // a cell is half as wide as it is tall
  chh = cw * 2.05;
  fs = cw / 0.6;
  canvas.style.height = (chh * H) + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(chh * H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `700 ${fs}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
}

function draw(i) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cw * W, chh * H);
  if (!frames) return;
  const base = i * W * H;
  let last = -1;
  for (let y = 0; y < H; y++) {
    const cy = (y + 0.5) * chh;
    for (let x = 0; x < W; x++) {
      const v = frames[base + y * W + x];
      if (!v) continue;
      const c = v >> 4;
      if (c !== last) { ctx.fillStyle = COLORS[c]; last = c; }
      ctx.fillText(CHARS[v & 15], (x + 0.5) * cw, cy);
    }
  }
}

function tick(now) {
  if (playing) {
    const i = indexAt((now - t0) / 1000 + offset);
    if (i !== frameIdx) { frameIdx = i; draw(i); }
  }
  requestAnimationFrame(tick);
}

async function decode() {
  const bin = Uint8Array.from(atob(BLOB), ch => ch.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint16Array(buf);
}

btn.addEventListener('click', () => {
  if (playing) { offset = (performance.now() - t0) / 1000 + offset; playing = false; btn.textContent = 'Play'; }
  else { t0 = performance.now(); playing = true; btn.textContent = 'Pause'; }
});
replay.addEventListener('click', () => {
  t0 = performance.now(); offset = 0; frameIdx = -1;
  playing = true; btn.textContent = 'Pause';
});
window.addEventListener('resize', () => { layout(); if (frameIdx >= 0) draw(frameIdx); });

// ---- Music ------------------------------------------------------------------
// The song lives at audio/song.mp3 next to this page. It starts when the
// viewer taps "Open your flowers" or "Play song" (a tap is what lets phones
// play sound), fades in over 2 s and loops.
const audio = document.getElementById('audio');
const songBtn = document.getElementById('songplay');
const seek = document.getElementById('seek');
const cur = document.getElementById('cur');
const dur = document.getElementById('dur');
const songName = document.getElementById('songname');
const songMsg = document.getElementById('songmsg');
const gate = document.getElementById('gate');
const openBtn = document.getElementById('open');
const FADE_S = 2;
let seeking = false, songOk = null, actx = null, gain = null;
if (!songName.textContent.trim()) songName.hidden = true;

const fmt = s => {
  if (!isFinite(s)) return '--:--';
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
function say(msg) { songMsg.textContent = msg; songMsg.hidden = !msg; }
function songUnavailable() {
  songOk = false;
  audio.pause();
  songBtn.disabled = true;
  seek.disabled = true;
  cur.textContent = '--:--';
  dur.textContent = '--:--';
  say("The song couldn't be loaded, so the flowers are playing without music.");
}
audio.addEventListener('error', songUnavailable);
// Phones often skip preloading, so ask the server directly whether the file
// is there instead of waiting for a play attempt to fail.
if (location.protocol.startsWith('http')) {
  fetch(audio.currentSrc || audio.src, { method: 'HEAD', cache: 'no-store' })
    .then(r => { if (!r.ok) songUnavailable(); })
    .catch(() => {});
}

// 2 s fade-in. iPhone Safari ignores audio.volume, so over http(s) the fade
// runs through Web Audio; opened from a file it falls back to the volume.
const AC = window.AudioContext || window.webkitAudioContext;
const useWebAudio = !!AC && location.protocol.startsWith('http');
function fadeIn() {
  if (useWebAudio) {
    try {
      if (!actx) {
        actx = new AC();
        gain = actx.createGain();
        actx.createMediaElementSource(audio).connect(gain).connect(actx.destination);
      }
      actx.resume();
      const now = actx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(1, now + FADE_S);
      return;
    } catch (e) { /* fall through to the volume fade */ }
  }
  audio.volume = 0;
  const start = performance.now();
  const step = now => {
    const k = Math.min(1, (now - start) / (FADE_S * 1000));
    audio.volume = k;
    if (k < 1 && !audio.paused) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
// Must run inside a tap/click so every browser allows the sound.
function startSong() {
  if (songOk === false) return;
  fadeIn();
  const p = audio.play();
  if (p && p.catch) p.catch(err => {
    if (songOk === false) return;
    if (err && err.name === 'NotAllowedError') say('Tap "Play song" to start the music.');
    else songUnavailable();
  });
}

songBtn.addEventListener('click', () => { if (audio.paused) startSong(); else audio.pause(); });
audio.addEventListener('play', () => { songBtn.textContent = 'Pause song'; if (songOk !== false) say(''); });
audio.addEventListener('pause', () => { songBtn.textContent = 'Play song'; });
audio.addEventListener('loadedmetadata', () => {
  songOk = true;
  seek.max = audio.duration;
  dur.textContent = fmt(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if (!seeking) seek.value = audio.currentTime;
  cur.textContent = fmt(seeking ? +seek.value : audio.currentTime);
});
seek.addEventListener('input', () => { seeking = true; cur.textContent = fmt(+seek.value); });
seek.addEventListener('change', () => {
  if (isFinite(audio.duration)) audio.currentTime = +seek.value;
  seeking = false;
});

// "Open your flowers": starts the bloom from the bud and the music together.
openBtn.addEventListener('click', () => {
  gate.hidden = true;
  t0 = performance.now(); offset = 0; frameIdx = -1;
  playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  btn.textContent = playing ? 'Pause' : 'Play';
  if (!playing) draw(0);
  startSong();
});

(async () => {
  layout(); draw(0);
  try { await document.fonts.load(`700 16px "JetBrains Mono"`); } catch (e) {}
  try {
    frames = await decode();
  } catch (e) {
    status.textContent = 'This browser could not unpack the animation. Try a current Chrome, Safari or Firefox.';
    return;
  }
  layout(); draw(0);
  openBtn.focus();
  requestAnimationFrame(tick);
})();
</script>
