<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* One terminal window, centred on pure black: the bouquet is the whole page. */
  :root {
    --bg: #000000;          /* same black the renderer paints behind every cell */
    --panel: #0c0c0e;
    --line: #26262c;
    --fg: #e6e6ea;
    --muted: #8d8d98;
    --accent: #ff5fa8;      /* the ribbon pink */
    --leaf: #a8f0a0;        /* light leaf green for Replay bloom */
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .term {
    /* as wide as fits, but never taller than the screen (canvas is ~1.07x
       as tall as wide, plus the title bar, button and page padding) */
    width: min(100%, 880px, calc((100vh - 150px) * 0.93));
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
  .bar .name { flex: 1; text-align: center; letter-spacing: 0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas { display: block; width: 100%; height: auto; }
  .controls {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    font: 600 13px var(--mono);
    color: var(--bg);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btns { display: flex; gap: 8px; }
  button.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #replay { color: var(--leaf); box-shadow: inset 0 0 0 1px var(--leaf); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  code { color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
  #status { min-height: 1em; }
  button:disabled { opacity: 0.4; cursor: default; }
  .player {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .player .track { color: var(--accent); letter-spacing: 0.02em; }
  button.small { font-size: 12px; padding: 4px 10px; }
  /* The embedded player runs invisibly. Only if a browser refuses to start it
     from our own buttons does its compact bar appear, to be tapped directly. */
  .sc {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 1px;
    height: 1px;
    border: 0;
    opacity: 0;
    pointer-events: none;
  }
  .sc.show {
    position: static;
    width: 100%;
    height: 20px;
    opacity: 1;
    pointer-events: auto;
  }
  /* Everything fades in together once the flowers open. */
  .stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  .stage.open { opacity: 1; }
  #gate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: var(--bg);
    transition: opacity 0.8s ease;
  }
  #gate.leaving { opacity: 0; pointer-events: none; }
  #gate .heart { color: var(--leaf); font-size: 22px; animation: beat 1.6s ease-in-out infinite; }
  #open {
    font: 700 16px var(--mono);
    letter-spacing: 0.03em;
    padding: 14px 28px;
    border-radius: 999px;
    padding: 14px 44px;
    color: #000;
    background: var(--leaf);
    box-shadow: 0 0 28px rgba(168, 240, 160, 0.45);
    animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes beat { 0%, 100% { opacity: 0.35; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 18px rgba(168, 240, 160, 0.30); } 50% { box-shadow: 0 0 36px rgba(168, 240, 160, 0.65); } }
  @media (prefers-reduced-motion: reduce) {
    .stage, #gate { transition: none; }
    #gate .heart, #open { animation: none; }
  }
  [hidden] { display: none !important; }
</style>

<div id="gate" aria-live="polite">
  <span class="heart" id="wait" aria-label="Loading">♡</span>
  <button id="open" type="button" hidden>Open</button>
</div>
<div class="stage" id="stage">
<div class="term">
  <div class="bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="name">python3 main.py — 150×78</span>
    <span style="width:42px"></span>
  </div>
  <canvas id="screen" width="880" height="920" aria-label="A rotating bouquet of flowers drawn in coloured ASCII characters"></canvas>
</div>
<div class="controls">
  <span class="btns"><button id="replay" type="button" class="ghost">Replay bloom</button></span>
  <span id="status"></span>
</div>
<div class="player" id="player" aria-label="Music">
  <button id="pp" type="button" class="ghost small" hidden>Pause</button>
  <iframe id="sc" class="sc" title="I Root — Michael Nau" allow="autoplay; encrypted-media"
          src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A309952156&amp;color=%23ff5fa8&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false&amp;visual=false"></iframe>
</div>
</div>
<script src="https://w.soundcloud.com/player/api.js"></script>

<script>
const META = __META__;
const BLOB = "__BLOB__";

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const { w: W, h: H, n: N, period: PERIOD, chars: CHARS, palette } = META;
const COLORS = [null, ...palette];
const BG = '#000000';
const replay = document.getElementById('replay');
// The first NI frames are the bloom (played once, INTRO seconds long); the
// N frames after them loop forever.
const INTRO = META.intro, NI = META.ni;
let frames = null, playing = false, frameIdx = -1, t0 = performance.now(), offset = 0;
function indexAt(elapsed) {
  elapsed = Math.max(0, elapsed);     // a frame stamped just before a tap
  if (elapsed < INTRO) return Math.min(NI - 1, Math.floor(elapsed / INTRO * NI));
  return NI + Math.floor(((elapsed - INTRO) % PERIOD) / PERIOD * N) % N;
}
let cw = 0, chh = 0, fs = 0;

function layout() {
  const cssW = canvas.parentElement.clientWidth;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = cssW / W;                 // a cell is half as wide as it is tall
  chh = cw * 2.05;
  fs = cw / 0.6;
  canvas.style.height = (chh * H) + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(chh * H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `700 ${fs}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
}

function draw(i) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cw * W, chh * H);
  if (!frames) return;
  const base = i * W * H;
  let last = -1;
  for (let y = 0; y < H; y++) {
    const cy = (y + 0.5) * chh;
    for (let x = 0; x < W; x++) {
      const v = frames[base + y * W + x];
      if (!v) continue;
      const c = v >> 4;
      if (c !== last) { ctx.fillStyle = COLORS[c]; last = c; }
      ctx.fillText(CHARS[v & 15], (x + 0.5) * cw, cy);
    }
  }
}

function tick(now) {
  if (playing) {
    const i = indexAt((now - t0) / 1000 + offset);
    if (i !== frameIdx) { frameIdx = i; draw(i); }
  }
  requestAnimationFrame(tick);
}

async function decode() {
  const bin = Uint8Array.from(atob(BLOB), ch => ch.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint16Array(buf);
}

window.addEventListener('resize', () => { layout(); if (frameIdx >= 0) draw(frameIdx); });

// ---- Opening and music -----------------------------------------------------
// "I Root" by Michael Nau streams from SoundCloud through an invisible embedded
// player, driven by its Widget API; nothing is downloaded or rehosted.
//
// On load the page asks the player to start. If the browser lets it play
// unprompted, the bouquet fades in with the music. If the browser holds sound
// back until the visitor interacts (most phones), a black screen offers
// a single "Open" button; that tap calls play() straight from the click
// handler, so the tap itself counts as the permission, and the bouquet fades
// in at the same moment. Should a browser still refuse, the next tap anywhere
// on the page asks again. Playback is never retried on its own.
const gate = document.getElementById('gate');
const openBtn = document.getElementById('open');
const waitHeart = document.getElementById('wait');
const stage = document.getElementById('stage');
const pp = document.getElementById('pp');
const playerRow = document.getElementById('player');
const scFrame = document.getElementById('sc');
let widget = null, scReady = false, scPlaying = false, failed = false;
let phase = 'deciding';            // deciding -> gate -> open
let wantPlay = true, fallbackTimer = 0, decideTimer = 0, framesReady = false, revealed = false;

function music(state) { document.body.dataset.music = state; }
const TAP_EVENTS = ['pointerdown', 'touchend', 'keydown'];
function onTap() { if (!scPlaying) play(); }
function waitForTap() { TAP_EVENTS.forEach(e => window.addEventListener(e, onTap, { capture: true })); }
function stopWaitingForTap() { TAP_EVENTS.forEach(e => window.removeEventListener(e, onTap, { capture: true })); }

function startBouquet() {
  if (!framesReady || !revealed) return;
  layout(); t0 = performance.now(); offset = 0; frameIdx = -1;
  playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!playing) draw(NI);          // reduced motion: one still, fully bloomed
}
function reveal() {
  if (revealed) return;
  revealed = true; phase = 'open';
  clearTimeout(decideTimer);
  gate.classList.add('leaving');
  setTimeout(() => { gate.hidden = true; }, 900);
  stage.classList.add('open');
  document.body.dataset.phase = 'open';
  startBouquet();
}
function showGate() {
  if (phase !== 'deciding') return;
  phase = 'gate';
  document.body.dataset.phase = 'gate';
  waitHeart.hidden = true;
  openBtn.hidden = false;
  openBtn.focus({ preventScroll: true });
}

function setPlaying(on) {
  scPlaying = on;
  music(on ? 'playing' : (scReady ? 'paused' : 'loading'));
  pp.textContent = on ? 'Pause' : 'Play ♡';
  if (on) {
    clearTimeout(fallbackTimer);
    stopWaitingForTap();
    if (phase !== 'open') reveal();          // autoplay was allowed (even if slow to start)
  }
}
function play() {
  wantPlay = true;
  if (scReady) widget.play();                // called inside the tap handler
}
// After a tap that should have started the song: if nothing is playing a few
// seconds later, show the player's own bar for one direct tap.
function expectPlayback() {
  clearTimeout(fallbackTimer);
  fallbackTimer = setTimeout(() => {
    if (scPlaying || failed) return;
    music('needs-tap');
    waitForTap();                  // try again on her next tap anywhere
  }, 3500);
}
function musicUnavailable() {
  if (failed) return;
  failed = true;
  clearTimeout(fallbackTimer);
  music('unavailable');
  playerRow.hidden = true;                    // the flowers carry on quietly
  if (phase !== 'open') reveal();
}

openBtn.addEventListener('click', () => { play(); reveal(); expectPlayback(); });
pp.addEventListener('click', () => {
  if (scPlaying) { wantPlay = false; widget.pause(); }
  else { play(); expectPlayback(); }
});

function initPlayer() {
  if (!window.SC || !SC.Widget) { musicUnavailable(); return; }
  widget = SC.Widget(scFrame);
  const E = SC.Widget.Events;
  widget.bind(E.READY, () => {
    scReady = true;
    setPlaying(false);
    if (phase === 'deciding') {
      widget.play();                          // autoplay attempt, once
      decideTimer = setTimeout(showGate, 3000);
    } else if (wantPlay) {
      widget.play();                          // tapped before the player was ready
    }
  });
  // A blocked attempt reports PLAY then PAUSE straight away, so the song only
  // counts as playing once it is actually moving.
  // A last progress report can trail a pause, so ignore it if the visitor paused.
  widget.bind(E.PLAY_PROGRESS, () => { if (!scPlaying && wantPlay) setPlaying(true); });
  widget.bind(E.PAUSE, () => { setPlaying(false); if (phase === 'deciding') showGate(); });
  widget.bind(E.FINISH, () => { widget.seekTo(0); widget.play(); });   // play it again
  widget.bind(E.ERROR, musicUnavailable);
  setTimeout(() => { if (!scReady) musicUnavailable(); }, 12000);
  // A slow connection shouldn't leave a black screen: offer the button.
  setTimeout(() => { if (!scPlaying) showGate(); }, 6000);
}
music('loading');
document.body.dataset.phase = 'deciding';
initPlayer();

replay.addEventListener('click', () => { t0 = performance.now(); offset = 0; frameIdx = -1; playing = true; });

(async () => {
  layout(); draw(0);
  try { await document.fonts.load(`700 16px "JetBrains Mono"`); } catch (e) {}
  try {
    frames = await decode();
  } catch (e) {
    status.textContent = 'This browser could not unpack the animation. Try a current Chrome, Safari or Firefox.';
    reveal();
    return;
  }
  framesReady = true;
  layout(); draw(0);
  requestAnimationFrame(tick);
  startBouquet();
})();
</script>
