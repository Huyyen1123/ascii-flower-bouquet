<title>ASCII Flower Bouquet</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* One terminal window, centred on pure black: the bouquet is the whole page. */
  :root {
    --bg: #000000;          /* same black the renderer paints behind every cell */
    --panel: #0c0c0e;
    --line: #26262c;
    --fg: #e6e6ea;
    --muted: #8d8d98;
    --accent: #ff5fa8;      /* the ribbon pink */
    --leaf: #a8f0a0;        /* light leaf green for Replay bloom */
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .term {
    /* as wide as fits, but never taller than the screen (canvas is ~1.07x
       as tall as wide, plus the title bar, button and page padding) */
    width: min(100%, 880px, calc((100vh - 150px) * 0.93));
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
  .bar .name { flex: 1; text-align: center; letter-spacing: 0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas { display: block; width: 100%; height: auto; }
  .controls {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    font: 600 13px var(--mono);
    color: var(--bg);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btns { display: flex; gap: 8px; }
  button.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #replay { color: var(--leaf); box-shadow: inset 0 0 0 1px var(--leaf); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  code { color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
  #status { min-height: 1em; }
  button:disabled { opacity: 0.4; cursor: default; }
  .player {
    width: min(100%, 880px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  /* The music player runs invisibly; only the button shows. */
  .sc {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 1px;
    height: 1px;
    border: 0;
    opacity: 0;
    pointer-events: none;
  }
  [hidden] { display: none !important; }
</style>

<div class="term">
  <div class="bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="name">python3 main.py — 150×78</span>
    <span style="width:42px"></span>
  </div>
  <canvas id="screen" width="880" height="920" aria-label="A rotating bouquet of flowers drawn in coloured ASCII characters"></canvas>
</div>
<div class="controls">
  <span class="btns"><button id="replay" type="button" class="ghost">Replay bloom</button></span>
  <span id="status"></span>
</div>
<div class="player" aria-label="Music">
  <iframe id="sc" class="sc" title="Background music" aria-hidden="true" tabindex="-1" allow="autoplay; encrypted-media"
          src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A500269605&amp;color=%23ff5fa8&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false&amp;show_artwork=false&amp;visual=false"></iframe>
</div>
<script src="https://w.soundcloud.com/player/api.js"></script>

<script>
const META = __META__;
const BLOB = "__BLOB__";

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const { w: W, h: H, n: N, period: PERIOD, chars: CHARS, palette } = META;
const COLORS = [null, ...palette];
const BG = '#000000';
const replay = document.getElementById('replay');
// The first NI frames are the bloom (played once, INTRO seconds long); the
// N frames after them loop forever.
const INTRO = META.intro, NI = META.ni;
let frames = null, playing = false, frameIdx = -1, t0 = performance.now(), offset = 0;
function indexAt(elapsed) {
  elapsed = Math.max(0, elapsed);     // a frame stamped just before a tap
  if (elapsed < INTRO) return Math.min(NI - 1, Math.floor(elapsed / INTRO * NI));
  return NI + Math.floor(((elapsed - INTRO) % PERIOD) / PERIOD * N) % N;
}
let cw = 0, chh = 0, fs = 0;

function layout() {
  const cssW = canvas.parentElement.clientWidth;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = cssW / W;                 // a cell is half as wide as it is tall
  chh = cw * 2.05;
  fs = cw / 0.6;
  canvas.style.height = (chh * H) + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(chh * H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `700 ${fs}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
}

function draw(i) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cw * W, chh * H);
  if (!frames) return;
  const base = i * W * H;
  let last = -1;
  for (let y = 0; y < H; y++) {
    const cy = (y + 0.5) * chh;
    for (let x = 0; x < W; x++) {
      const v = frames[base + y * W + x];
      if (!v) continue;
      const c = v >> 4;
      if (c !== last) { ctx.fillStyle = COLORS[c]; last = c; }
      ctx.fillText(CHARS[v & 15], (x + 0.5) * cw, cy);
    }
  }
}

function tick(now) {
  if (playing) {
    const i = indexAt((now - t0) / 1000 + offset);
    if (i !== frameIdx) { frameIdx = i; draw(i); }
  }
  requestAnimationFrame(tick);
}

async function decode() {
  const bin = Uint8Array.from(atob(BLOB), ch => ch.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint16Array(buf);
}

replay.addEventListener('click', () => {
  t0 = performance.now(); offset = 0; frameIdx = -1;
  playing = true;
});
window.addEventListener('resize', () => { layout(); if (frameIdx >= 0) draw(frameIdx); });

// ---- Music -----------------------------------------------------------------
// An invisible embedded player streams the song; the page drives it through
// the player's Widget API. It tries to start as soon as it is ready; where
// the browser holds sound back until the visitor interacts (most phones, and
// desktop browsers on a first visit), it starts on the first tap, click or
// key press anywhere on the page.
const scFrame = document.getElementById('sc');
let widget = null, scReady = false, wantPlay = true, scPlaying = false;

function setPlaying(on) {
  scPlaying = on;
  document.body.dataset.music = on ? 'playing' : (scReady ? 'ready' : 'loading');
  if (on) stopWaitingForTap();
}
const TAP_EVENTS = ['pointerdown', 'touchend', 'keydown'];
function onFirstTap() { if (!scPlaying) playSong(); }
function waitForTap() { TAP_EVENTS.forEach(e => window.addEventListener(e, onFirstTap, { capture: true })); }
function stopWaitingForTap() { TAP_EVENTS.forEach(e => window.removeEventListener(e, onFirstTap, { capture: true })); }
function playSong() {
  wantPlay = true;
  if (scReady) widget.play();               // otherwise starts once ready
}
function musicUnavailable() {
  document.body.dataset.music = 'unavailable';   // the flowers carry on quietly
}
function initPlayer() {
  if (!window.SC || !SC.Widget) { musicUnavailable(); return; }
  widget = SC.Widget(scFrame);
  const E = SC.Widget.Events;
  widget.bind(E.READY, () => {
    scReady = true;
    setPlaying(false);
    if (wantPlay) playSong();
  });
  // A blocked autoplay reports PLAY and then PAUSE at once, so only count
  // the song as playing once it is actually moving, and keep listening for
  // the first tap until then.
  widget.bind(E.PLAY_PROGRESS, () => { if (!scPlaying) setPlaying(true); });
  widget.bind(E.PAUSE, () => { setPlaying(false); waitForTap(); });
  widget.bind(E.FINISH, () => { widget.seekTo(0); widget.play(); });   // keep it going
  widget.bind(E.ERROR, musicUnavailable);
  setTimeout(() => { if (!scReady) musicUnavailable(); }, 12000);
}
document.body.dataset.music = 'loading';
waitForTap();
initPlayer();

(async () => {
  layout(); draw(0);
  try { await document.fonts.load(`700 16px "JetBrains Mono"`); } catch (e) {}
  try {
    frames = await decode();
  } catch (e) {
    status.textContent = 'This browser could not unpack the animation. Try a current Chrome, Safari or Firefox.';
    return;
  }
  layout(); draw(0);
  t0 = performance.now(); offset = 0; frameIdx = -1;
  playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(tick);
})();
</script>
